# Hermes Agent configuration, pushed into /opt/data/config.yaml by
# `amphoractl config push`. No secrets.

# Timezone: not set here. amphoractl passes HERMES_TIMEZONE (AMPHORA_TIMEZONE, default
# the host's zone), which Hermes reads before any `timezone` key in this file.

# ---------------------------------------------------------------- model ----
model:
  provider: openrouter
  model: z-ai/glm-5.3-flash

fallback_providers:
  - provider: openrouter
    model: openai/gpt-5.6-luna
  - provider: openrouter
    model: minimax/minimax-m3

provider_routing:
  sort: "throughput"
  data_collection: "deny"
  require_parameters: true
  ignore: ["OpenInference"]

auxiliary:
  vision:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  compression:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  title_generation:
    provider: openrouter
    model: z-ai/glm-5.3-flash
  approval:
    provider: openrouter
    model: z-ai/glm-5.3-flash

compression:
  enabled: true
  threshold: 0.60
  target_ratio: 0.20

# ---------------------------------------------------------------- agent ----
# browser, connections and catalog run code in the Hermes container, not the sandbox, so
# they would bypass it. doctor fails if any is missing here (TOOLSETS_OFF in settings.sh).
agent:
  disabled_toolsets:
    - computer_use
    - browser
    - connections
    - catalog

# Mail-client skills off; email is the gateway adapter (EMAIL.md).
skills:
  disabled:
    - google-workspace
    - himalaya
    - email-inbox-triage

# Hermes' own kanban off: tasks live on the Obsidian board, and a second store would drift.
kanban:
  dispatch_in_gateway: false
  dispatch_profiles: []

# No shutdown/restart notices on the messaging platforms. Behaviour only:
# the adapters are enabled by environment, and an `enabled:` key here would override it.
platforms:
  signal:
    gateway_restart_notification: false
  email:
    gateway_restart_notification: false

# ------------------------------------------------------------- terminal ----
terminal:
  backend: docker
  docker_image: "amphora-sandbox:local"
  docker_mount_cwd_to_workspace: false
  # >>> amphoractl:mounts
  # GENERATED by `amphoractl config push` — edits between the markers are discarded.
  # Change the list with `amphoractl mount add|rm`.
  docker_volumes:
    - "/projects:/projects"
    - "/mounts/outbox:/mounts/outbox"
  # <<< amphoractl:mounts
  docker_forward_env: []           # security decision: no credential reaches the sandbox
  docker_env:
    PYTHONUNBUFFERED: "1"
  docker_run_as_host_user: false   # MUST stay false: it reads ids in the hermes container, not on the Mac
  docker_network: true

  container_cpu: 2
  container_memory: 4096           # MB
  container_persistent: true
  docker_persist_across_processes: true
  docker_orphan_reaper: true

  cwd: "/projects"
  timeout: 300
  lifetime_seconds: 900

# ------------------------------------------------------------------ web ----
web:
  search_backend: "searxng"

# --------------------------------------------------------------- memory ----
memory:
  memory_enabled: true
